version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    - gawk
    - pandoc
  jobs:
    pre_build:
      - cd docs/rtd && awk -f splitmd.awk ../MANUAL.markdown

# Build documentation in the docs/rtd directory with Sphinx
sphinx:
   configuration: docs/rtd/conf.py

# 1. Read the Docs creates the environment and installs these first
python:
  install:
    - requirements: docs/rtd/requirements.txt
