version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14" # Note: Python 3.14 is currently in pre-release/unsupported; 3.13 is standard.
  apt_packages:
    - gawk
    - pandoc

# 1. Read the Docs creates the environment and installs these first
python:
  install:
    - requirements: docs/rtd/requirements.txt

# 2. These jobs execute sequentially after the install phase completes
jobs:
  post_install:
    # Always run commands from the repository root; explicit CD handles the scope
    - cd docs/rtd && awk -f splitmd.awk ../MANUAL.markdown

  build:
    html:
      # Build output must strictly go to the $READTHEDOCS_OUTPUT/html variable
      - sphinx-build -W -b dirhtml docs/rtd $READTHEDOCS_OUTPUT/html
