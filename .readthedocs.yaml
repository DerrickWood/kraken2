version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    - gawk
    - pandoc

# Build documentation in the docs/rtd directory with Sphinx
sphinx:
   configuration: docs/rtd/conf.py

# Dependencies required to build your docs
python:
   install:
   - requirements: docs/rtd/requirements.txt
