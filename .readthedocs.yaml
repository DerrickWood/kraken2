version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  apt_packages:
    - gawk
    - pandoc
  commands:
    - cd docs/rtd && cat ../MANUAL.markdown | awk -f splitmd.awk
    - sphinx-build -W -b dirhtml docs/rtd $READTHEDOCS_OUTPUT/html

# Build documentation in the docs/rtd directory with Sphinx
sphinx:
   configuration: docs/rtd/conf.py

# Dependencies required to build your docs
python:
   install:
   - requirements: docs/rtd/requirements.txt
